<style>
/* ============================================================
   COFFRE — feuille de style iPhone
   Un seul jeu de règles (plus de passes correctives empilées).
   Thème clair + sombre, la carte « coffre » et l'écran de code
   restent sombres dans les deux.
   Texte 17 · secondaire 15 · légende 13 · micro 11
   Cibles tactiles : 44pt minimum
   ============================================================ */

:root{
  --bg:#F2F2F7; --card:#FFFFFF; --sheet:#F2F2F7; --field:#FFFFFF;
  --ink:#17161B; --muted:rgba(60,60,67,.68); --faint:rgba(60,60,67,.36);
  --sep:rgba(60,60,67,.14); --fill:rgba(118,118,128,.12); --fill-2:rgba(118,118,128,.22);
  --seg-on:#FFFFFF;
  --accent:#8A5F0C; --accent-soft:rgba(196,146,45,.18);
  --gold:#E3B659; --gold-deep:#C2912F; --gold-ink:#221803;
  --danger:#D4303C; --danger-soft:rgba(212,48,60,.1); --ok:#1C9A66;
  --glass:rgba(249,249,251,.8); --glass-line:rgba(0,0,0,.08);
  --press:rgba(0,0,0,.05);
  --float:0 10px 30px rgba(20,18,30,.16),0 1px 3px rgba(20,18,30,.08);
  --vault-shadow:0 18px 34px -18px rgba(24,20,36,.55);

  --gutter:20px; --ico:44px;
  --sat:env(safe-area-inset-top,0px);
  --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px);
  --sar:env(safe-area-inset-right,0px);
  --bar-top:max(8px,calc(var(--sat) + 4px));

  --font-d:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --font-b:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --font-n:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Helvetica Neue",system-ui,sans-serif;

  color-scheme:light;
  box-sizing:border-box;
}
/* Dans le lecteur claude.ai (iframe) les marges système sont déjà en partie prises en compte */
:root.framed{
  --sab:min(env(safe-area-inset-bottom,0px),8px);
  --sat:min(env(safe-area-inset-top,0px),16px);
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --card:#18181C; --sheet:#1A1A1E; --field:#28282D;
    --ink:#F5F3EE; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.32);
    --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.22); --fill-2:rgba(118,118,128,.36);
    --seg-on:#5B5B61;
    --accent:#E6C27A; --accent-soft:rgba(230,194,122,.16);
    --danger:#FF6B6B; --danger-soft:rgba(255,107,107,.13); --ok:#4FD1A1;
    --glass:rgba(30,30,34,.74); --glass-line:rgba(255,255,255,.1);
    --press:rgba(255,255,255,.06);
    --float:0 12px 32px rgba(0,0,0,.55);
    --vault-shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --card:#18181C; --sheet:#1A1A1E; --field:#28282D;
  --ink:#F5F3EE; --muted:rgba(235,235,245,.6); --faint:rgba(235,235,245,.32);
  --sep:rgba(255,255,255,.09); --fill:rgba(118,118,128,.22); --fill-2:rgba(118,118,128,.36);
  --seg-on:#5B5B61;
  --accent:#E6C27A; --accent-soft:rgba(230,194,122,.16);
  --danger:#FF6B6B; --danger-soft:rgba(255,107,107,.13); --ok:#4FD1A1;
  --glass:rgba(30,30,34,.74); --glass-line:rgba(255,255,255,.1);
  --press:rgba(255,255,255,.06);
  --float:0 12px 32px rgba(0,0,0,.55);
  --vault-shadow:none;
  color-scheme:dark;
}

*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}

html,body{
  position:fixed;inset:0;
  width:100%;height:var(--app-h,100%);
  margin:0;overflow:hidden;
  overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
html{background:var(--bg)}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-b);
  font-size:17px;
  line-height:1.4;
  letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,input,select{font-family:inherit;font-size:inherit;color:inherit;letter-spacing:inherit}
button{touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

body,button{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
input{user-select:text;-webkit-user-select:text}
/* 16px minimum : Safari iOS ne zoome pas au focus */
input,select,textarea{font-size:16px}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:22px;height:22px;display:block;stroke-width:1.8}

/* ============ STRUCTURE ============ */
#shell{
  position:relative;
  width:100%;height:var(--app-h,100%);
  margin:0 auto;
  overflow:hidden;
  isolation:isolate;
  background:var(--bg);
}

/* barre du haut : transparente, devient vitrée quand on fait défiler */
.top{
  position:absolute;inset:0 0 auto 0;z-index:30;
  display:flex;align-items:center;justify-content:flex-end;
  height:calc(var(--bar-top) + 52px);
  padding:var(--bar-top) max(var(--gutter),calc(var(--sar) + 16px)) 8px max(var(--gutter),calc(var(--sal) + 16px));
  pointer-events:none;
}
.top:empty{display:none}
.top > *{pointer-events:auto}
.top::before{
  content:"";position:absolute;inset:0;
  background:var(--glass);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  border-bottom:1px solid var(--glass-line);
  opacity:0;transition:opacity .2s;
}
.top.scrolled::before{opacity:1}
.top .ct{
  position:absolute;left:0;right:0;bottom:8px;height:44px;
  display:grid;place-items:center;
  font:600 17px var(--font-d);letter-spacing:-.02em;
  opacity:0;transform:translateY(6px);
  transition:opacity .2s,transform .2s;
  pointer-events:none;
}
.top.scrolled .ct{opacity:1;transform:none}
.acts{
  position:relative;display:flex;
  border-radius:22px;
  background:var(--glass);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  box-shadow:0 2px 10px rgba(0,0,0,.06);
}
.top.scrolled .acts{background:none;border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}

main{
  height:100%;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;
  scrollbar-width:none;
  padding:
    calc(var(--bar-top) + 52px)
    max(var(--gutter),calc(var(--sar) + 16px))
    calc(var(--sab) + 124px)
    max(var(--gutter),calc(var(--sal) + 16px));
}
main::-webkit-scrollbar{display:none}

/* grand titre façon iOS, dans le contenu */
.lt{padding:2px 2px 18px}
.lt h1{
  font:700 clamp(30px,8.8vw,34px)/1.1 var(--font-d);
  letter-spacing:-.028em;margin:0;
}
.lt p{margin:4px 0 0;color:var(--muted);font-size:15px;line-height:1.3}

/* ============ BOUTONS RONDS ============ */
.icon-btn{
  width:44px;height:44px;border-radius:50%;
  border:0;background:var(--fill);color:var(--ink);
  display:grid;place-items:center;
  cursor:pointer;flex:none;position:relative;
  transition:transform .14s,background .14s;
}
.icon-btn:active{transform:scale(.9);background:var(--fill-2)}
.icon-btn svg.i{width:20px;height:20px}
.acts .icon-btn{background:none}
.acts .icon-btn:active{background:var(--press)}

/* ============ BARRE D'ONGLETS FLOTTANTE ============ */
.dock{
  position:absolute;z-index:20;
  left:max(12px,calc(var(--sal) + 12px));
  right:max(12px,calc(var(--sar) + 12px));
  bottom:max(10px,calc(var(--sab) - 8px));
  display:flex;align-items:center;gap:10px;
  pointer-events:none;
}
.dock::before{
  content:"";position:absolute;z-index:-1;
  left:-40px;right:-40px;top:-26px;bottom:-60px;
  background:linear-gradient(to bottom,transparent,var(--bg) 62%);
  pointer-events:none;
}
.dock > *{pointer-events:auto}
.tabs{
  flex:1;min-width:0;height:62px;
  display:grid;grid-template-columns:repeat(4,1fr);
  padding:4px;border-radius:31px;
  background:var(--glass);
  border:1px solid var(--glass-line);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  backdrop-filter:blur(28px) saturate(180%);
  box-shadow:var(--float);
}
.tabs:empty{display:none}
.tab{
  border:0;background:none;
  border-radius:27px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font:600 10.5px var(--font-b);letter-spacing:-.005em;
  color:var(--muted);
  cursor:pointer;min-width:0;
  transition:background .2s,color .2s,transform .14s;
}
.tab .pill{display:grid;place-items:center}
.tab .pill svg.i{width:23px;height:23px}
.tab:active{transform:scale(.94)}
.tab[aria-current="page"]{color:var(--accent);background:var(--fill)}

.fab{
  flex:none;width:62px;height:62px;border-radius:50%;
  border:0;background:var(--gold);color:var(--gold-ink);
  display:grid;place-items:center;cursor:pointer;
  box-shadow:var(--float),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .15s;
}
.fab:active{transform:scale(.9)}
.fab svg.i{width:26px;height:26px;stroke-width:2.3}

/* ============ CARTE COFFRE (toujours sombre) ============ */
.hero,.summary{
  position:relative;
  color:#F5F3EE;
  background:linear-gradient(165deg,#292730 0%,#17161B 62%,#121116 100%);
  border:1px solid rgba(230,194,122,.2);
  box-shadow:var(--vault-shadow);
}
.hero{border-radius:26px;padding:20px 20px 18px}
.hero-label{font-size:15px;font-weight:500;color:rgba(245,243,238,.66);line-height:1.3}
.hero-amount{
  font:700 clamp(46px,14.5vw,60px)/1 var(--font-n);
  letter-spacing:-.035em;
  margin:8px 0 0;
  font-variant-numeric:tabular-nums;
  background:linear-gradient(180deg,#FFF4D6 10%,#E6C27A 75%,#CFA253 100%);
  -webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;
}
.hero-amount .dec{font-size:.42em;font-weight:600;letter-spacing:-.01em}

/* frise du mois : un trait par jour */
.strip{display:flex;align-items:flex-end;gap:3px;height:60px;margin-top:32px;position:relative}
.col{
  flex:1;height:100%;min-width:0;
  display:flex;align-items:flex-end;justify-content:center;
  border:0;background:none;padding:0;position:relative;color:inherit;
}
button.col{cursor:pointer}
.col i{
  display:block;width:100%;max-width:7px;height:4px;
  border-radius:4px;background:rgba(255,255,255,.16);
  transition:height .3s;
}
.col.has i{background:#E6C27A}
.col.has.fut i{background:transparent;box-shadow:inset 0 0 0 1.5px #E6C27A}
.col.today::after{
  content:"";position:absolute;left:50%;top:-6px;bottom:-4px;
  border-left:1px dashed rgba(230,194,122,.6);
}
.col.today b{
  position:absolute;top:-24px;left:50%;transform:translateX(-50%);
  font:700 11px var(--font-b);white-space:nowrap;
  background:#E6C27A;color:#221803;
  border-radius:7px;padding:2px 7px;
}
.axis{
  display:flex;justify-content:space-between;
  font-size:12px;font-weight:500;color:rgba(245,243,238,.45);
  margin-top:9px;
}
.hero-stats{
  display:grid;grid-template-columns:repeat(3,1fr);
  margin-top:16px;padding-top:14px;
  border-top:1px solid rgba(255,255,255,.1);
}
.hero-stats div{padding:0 10px;border-left:1px solid rgba(255,255,255,.1);min-width:0}
.hero-stats div:first-child{padding-left:0;border-left:0}
.hero-stats small{display:block;color:rgba(245,243,238,.55);font-size:12px;font-weight:500;line-height:1.3;margin-bottom:2px}
.hero-stats b{font:600 clamp(15px,4.4vw,18px) var(--font-n);font-variant-numeric:tabular-nums;white-space:nowrap}

.summary{
  display:grid;grid-template-columns:1fr 1fr;
  border-radius:22px;padding:18px 20px;
}
.summary small{display:block;color:rgba(245,243,238,.6);font-size:13px;font-weight:500;margin-bottom:3px}
.summary b{font:700 clamp(23px,7vw,28px) var(--font-n);letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:#EFD292}
.summary div{min-width:0}
.summary div + div{border-left:1px solid rgba(255,255,255,.12);padding-left:18px}

/* rappel */
.soon{
  display:flex;gap:12px;align-items:flex-start;
  margin-top:12px;padding:14px 16px;
  border-radius:18px;background:var(--accent-soft);
  font-size:15px;font-weight:500;line-height:1.4;
}
.soon svg.i{width:20px;height:20px;color:var(--accent);flex:none;margin-top:1px}
.soon b{font-weight:700}

/* ============ SECTIONS ============ */
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px;padding:0 4px}
.sec-h h2{font:700 20px var(--font-d);letter-spacing:-.024em;margin:0;min-width:0}
.link{
  background:none;border:0;color:var(--accent);
  font:500 16px var(--font-b);cursor:pointer;
  padding:6px 0;margin:-6px 0;
  white-space:nowrap;flex:none;
}
.link:active{opacity:.5}

/* ============ CARTES ET LISTES ============ */
.group,.budget,.donut-wrap,.chart,.empty,.calbox{
  background:var(--card);
  border-radius:20px;
}
.group{overflow:hidden}
.group.gap{margin-top:12px}
.row{
  position:relative;
  display:flex;align-items:center;gap:14px;
  width:100%;min-height:64px;
  padding:10px 16px;
  border:0;background:none;
  text-align:left;color:inherit;font:inherit;
  cursor:pointer;
  transition:background .12s;
}
.row + .row::before{
  content:"";position:absolute;top:0;right:0;
  left:calc(16px + var(--ico) + 14px);
  height:1px;background:var(--sep);
}
.row:active{background:var(--press)}
.row.static{cursor:default;align-items:flex-start;padding-top:14px;padding-bottom:14px}
.row.static:active{background:none}
.row.static .row-name{white-space:normal}

.ico{
  width:var(--ico);height:var(--ico);
  border-radius:calc(var(--ico) * .3);
  display:grid;place-items:center;
  font-size:calc(var(--ico) * .5);line-height:1;flex:none;
  background:color-mix(in srgb,var(--c) 16%,var(--card));
}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-name{
  font-weight:600;font-size:17px;letter-spacing:-.02em;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.row-sub{font-size:14px;color:var(--muted);line-height:1.35}
.row-amt{
  text-align:right;white-space:nowrap;line-height:1.15;
  font:600 17px var(--font-n);font-variant-numeric:tabular-nums;
}
.row-amt small{display:block;font:500 12.5px var(--font-b);color:var(--muted);margin-top:2px}
.row.paused > *{opacity:.5}
.neg{font:600 17px var(--font-n);font-variant-numeric:tabular-nums;white-space:nowrap}

.tag{
  display:inline-block;vertical-align:3px;margin-left:8px;
  font:600 12px var(--font-b);letter-spacing:0;
  background:var(--accent-soft);color:var(--accent);
  border-radius:8px;padding:3px 8px;
}

/* ============ BUDGET ============ */
.budget{padding:18px}
.budget-big{font:700 22px var(--font-n);letter-spacing:-.02em;margin-bottom:14px;font-variant-numeric:tabular-nums}
.budget p{margin:-6px 0 16px;font-size:15px;color:var(--muted);line-height:1.4}
.bar{height:12px;border-radius:99px;background:var(--fill);overflow:hidden;display:flex}
.bar .p{background:var(--gold);height:100%;transition:width .4s ease}
.bar .f{height:100%;background:repeating-linear-gradient(135deg,var(--gold-deep) 0 3px,transparent 3px 7px);opacity:.7}
.bar.over .p{background:var(--danger)}
.budget-line{display:flex;justify-content:space-between;gap:10px;margin-top:12px;font-size:14px;color:var(--muted)}
.budget-line b{color:var(--ink);font-weight:600}

/* ============ RÉPARTITION ============ */
.donut-wrap{display:flex;gap:18px;align-items:center;padding:18px}
.donut{position:relative;width:116px;height:116px;flex:none}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut svg circle:first-child{stroke:var(--fill)}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.15}
.donut .mid b{font:700 18px var(--font-n);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.donut .mid small{font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;font-size:14px;font-weight:500}
.legend div{display:flex;align-items:center;gap:10px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.legend span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}

/* ============ RECHERCHE ET CHAMPS ============ */
.search{position:relative;margin-top:14px}
.search svg.i{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--muted);pointer-events:none}
.search .in{padding-left:40px;height:44px;border-radius:13px;background:var(--fill)}

.in{
  display:block;width:100%;min-width:0;height:50px;
  border-radius:14px;border:0;
  background:var(--field);color:var(--ink);
  padding:0 16px;
  font:400 17px var(--font-b);
  appearance:none;-webkit-appearance:none;
  transition:box-shadow .15s;
}
.in::placeholder{color:var(--faint)}
.in:focus{outline:none;box-shadow:0 0 0 2px var(--gold)}
input[type="search"]::-webkit-search-cancel-button{-webkit-appearance:none}
input[type="date"].in{text-align:left;line-height:50px;padding-right:10px}
input[type="date"].in::-webkit-date-and-time-value{text-align:left;margin:0}

.filters{display:flex;gap:8px;margin:12px calc(var(--gutter) * -1) 0;padding:0 var(--gutter) 2px;overflow-x:auto;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:0;background:var(--fill);color:var(--ink);
  border-radius:99px;min-height:38px;padding:8px 16px;
  font:500 15px var(--font-b);
  cursor:pointer;display:inline-flex;align-items:center;gap:6px;
  white-space:nowrap;flex:none;
  transition:background .15s,color .15s,transform .12s;
}
.sheet .chip{background:var(--field)}
.chip:active{transform:scale(.96)}
.chip[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600;box-shadow:inset 0 0 0 1.5px var(--accent)}

.sortline{display:flex;justify-content:space-between;align-items:center;margin:16px 4px 8px;font-size:15px;color:var(--muted)}
.sortline select{
  border:0;background:none;color:var(--accent);
  font:500 16px var(--font-b);
  padding:8px 20px 8px 0;margin:-8px 0;
  cursor:pointer;appearance:none;-webkit-appearance:none;text-align:right;
  background-image:
    linear-gradient(45deg,transparent 50%,var(--accent) 50%),
    linear-gradient(135deg,var(--accent) 50%,transparent 50%);
  background-position:calc(100% - 10px) 55%,calc(100% - 5px) 55%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;
}

/* ============ VIDE ============ */
.empty{text-align:center;padding:36px 24px 26px;margin-top:16px}
.empty .mark{width:60px;height:60px;display:block;margin:0 auto}
.empty h3{font:700 22px var(--font-d);letter-spacing:-.026em;margin:16px 0 6px}
.empty p{color:var(--muted);margin:0 auto 22px;font-size:15px;line-height:1.45;max-width:300px}
.empty-sm{padding:26px 20px;text-align:center;color:var(--muted);font-size:15px}

/* ============ CALENDRIER ============ */
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.cal-head > div{text-align:center;min-width:0}
.cal-head h2{font:700 20px var(--font-d);letter-spacing:-.024em;margin:0}
.cal-head small{display:block;font:500 14px var(--font-b);color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.calbox{padding:14px 8px 8px;margin-top:14px}
.dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;font-weight:600;color:var(--faint);margin-bottom:4px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px}
.day{
  border:0;background:none;color:var(--ink);padding:3px 0 6px;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  cursor:pointer;min-height:50px;
}
.day b{
  width:36px;height:36px;border-radius:50%;
  display:grid;place-items:center;
  font:500 17px var(--font-n);font-variant-numeric:tabular-nums;
  transition:background .15s,color .15s,transform .12s;
}
.day:active b{transform:scale(.88)}
.day.blank{cursor:default}
.day.today b{color:var(--accent);background:var(--accent-soft);font-weight:700}
.day.sel b{background:var(--gold);color:var(--gold-ink);font-weight:700}
.dts{display:flex;gap:3px;height:5px}
.dts i{width:5px;height:5px;border-radius:50%;background:var(--c)}

.day-total{display:flex;justify-content:space-between;align-items:baseline;margin:26px 4px 10px;gap:10px}
.day-total h3{font:700 20px var(--font-d);letter-spacing:-.024em;margin:0}
.day-total b{font:600 20px var(--font-n);font-variant-numeric:tabular-nums}

/* ============ HISTORIQUE ============ */
.chart{display:flex;align-items:flex-end;gap:10px;height:168px;padding:16px 14px 12px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px;min-width:0}
.bcol b{font:600 12px var(--font-n);font-variant-numeric:tabular-nums;color:var(--muted)}
.bcol .stack{width:100%;max-width:34px;flex:1;display:flex;flex-direction:column;justify-content:flex-end;border-radius:8px 8px 3px 3px;overflow:hidden}
.bcol .stack i{display:block;width:100%}
.bcol .stack .fu{background:repeating-linear-gradient(135deg,var(--gold-deep) 0 3px,transparent 3px 7px);opacity:.7}
.bcol .stack .pd{background:var(--gold)}
.bcol span{font-size:12px;font-weight:500;color:var(--muted);text-transform:lowercase}
.bcol.now span{color:var(--accent);font-weight:700}
.bcol.now b{color:var(--ink)}

.month-h{display:flex;justify-content:space-between;align-items:baseline;margin:28px 4px 10px;gap:10px;font:700 20px var(--font-d);letter-spacing:-.024em}
.month-h h3{margin:0;font:inherit}
.month-h span{font:600 17px var(--font-n);font-variant-numeric:tabular-nums;color:var(--muted)}

/* ============ BOUTONS ============ */
.btn{
  min-height:52px;border-radius:99px;border:0;
  font:600 17px var(--font-b);letter-spacing:-.015em;
  cursor:pointer;width:100%;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:0 20px;
  transition:transform .12s,opacity .15s;
}
.btn:active{transform:scale(.97);opacity:.8}
.btn.primary{background:var(--gold);color:var(--gold-ink)}
.btn.ghost{background:var(--fill);color:var(--ink)}
.sheet .btn.ghost{background:var(--field)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:50px;font-size:16px;width:auto;flex:none}
.btn.more{margin-top:20px}
.stack-btns{display:grid;gap:10px}
.inline{display:flex;gap:10px}

/* ============ FEUILLES ============ */
#sheetRoot{position:fixed;left:0;right:0;top:var(--vvt,0px);height:var(--vvh,100%);z-index:110;display:none}
#sheetRoot.open{display:block}
.scrim{position:absolute;inset:-100px 0;background:rgba(0,0,0,.42);opacity:0;transition:opacity .25s}
.show .scrim{opacity:1}
.sheet{
  position:absolute;left:50%;bottom:0;
  width:100%;max-height:calc(100% - max(12px,var(--sat)));
  color:var(--ink);background:var(--sheet);
  border-radius:28px 28px 0 0;
  transform:translate(-50%,100%);
  transition:transform .36s cubic-bezier(.22,.9,.25,1);
  display:flex;flex-direction:column;
  padding-bottom:var(--sab);
  box-shadow:0 -20px 60px rgba(0,0,0,.28);
  will-change:transform;
}
.show .sheet{transform:translate(-50%,0)}
.grab{width:36px;height:5px;border-radius:99px;background:var(--fill-2);margin:8px auto 0;flex:none}
.grab,.sheet-head{touch-action:none}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none;
  padding:10px max(20px,calc(var(--sar) + 12px)) 8px max(20px,calc(var(--sal) + 12px));
}
.sheet-head h3{font:700 22px var(--font-d);letter-spacing:-.026em;margin:0}
.sheet-head .icon-btn{width:36px;height:36px;background:var(--fill-2)}
.sheet-head .icon-btn::after{content:"";position:absolute;inset:-6px}
.sheet-head .icon-btn svg.i{width:16px;height:16px;stroke-width:2.4}
.sheet-body{
  overflow-y:auto;flex:1;
  -webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:none;
  padding:4px max(20px,calc(var(--sar) + 12px)) 16px max(20px,calc(var(--sal) + 12px));
}
.sheet-body::-webkit-scrollbar{display:none}
.sheet-body > p{color:var(--muted);margin:8px 0 0;font-size:16px;line-height:1.45}
.sheet-foot{
  flex:none;display:grid;gap:10px;
  padding:10px max(20px,calc(var(--sar) + 12px)) 12px max(20px,calc(var(--sal) + 12px));
}
.sheet-foot.duo{grid-template-columns:1fr 1fr}
.sheet-foot.duo .btn{padding:0 10px;font-size:16px;white-space:nowrap}
.sheet-foot.duo .danger{grid-column:1 / -1}

/* ============ CHAMPS DE FORMULAIRE ============ */
.field{margin-top:22px}
.field > label,.lbl{display:block;font:500 14px var(--font-b);color:var(--muted);margin:0 0 8px 4px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.field-row > div{min-width:0}
.hint{font-size:13.5px;line-height:1.45;color:var(--muted);margin:8px 4px 0}
.sheet .err{color:var(--danger);font-weight:600;font-size:15px;min-height:20px;margin:14px 4px 0}

.amount-field{
  display:flex;align-items:baseline;justify-content:center;gap:6px;
  margin:10px 0 4px;padding-bottom:8px;
  border-bottom:2px solid var(--sep);
  transition:border-color .15s;
}
.amount-field:focus-within{border-color:var(--gold)}
.amount-field input{
  font:700 clamp(44px,13vw,54px)/1.05 var(--font-n);
  letter-spacing:-.03em;
  width:100%;max-width:240px;min-width:0;
  text-align:right;border:0;background:none;color:var(--ink);outline:none;
  font-variant-numeric:tabular-nums;
}
.amount-field input::placeholder{color:var(--faint)}
.amount-field span{font:600 24px var(--font-n);color:var(--accent)}

.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:12px;padding:3px;gap:2px}
.seg button{
  border:0;background:none;border-radius:9px;
  min-height:38px;padding:0 4px;
  font:500 15px var(--font-b);color:var(--ink);
  cursor:pointer;transition:background .18s,box-shadow .18s;
}
.seg button[aria-pressed="true"]{background:var(--seg-on);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.14)}

.look{display:flex;gap:14px;align-items:flex-start}
.look .ico{--ico:56px;background:color-mix(in srgb,var(--c) 18%,var(--field))}
.emojis{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;flex:1}
.emojis button{
  height:42px;border:0;border-radius:12px;background:none;
  font-size:23px;line-height:1;cursor:pointer;
  transition:background .12s,transform .12s;
}
.emojis button:active{transform:scale(.88)}
.emojis button[aria-pressed="true"]{background:var(--field);box-shadow:inset 0 0 0 2px var(--gold)}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.swatches button{width:34px;height:34px;border-radius:50%;border:0;background:var(--c);cursor:pointer;transition:transform .12s}
.swatches button:active{transform:scale(.88)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--sheet),0 0 0 5px var(--ink)}

.sync-line{font-size:16px;margin:0 4px 12px;display:flex;gap:10px;align-items:center}

/* ============ DÉTAIL ============ */
.d-top{text-align:center;padding:2px 0 4px}
.d-top .ico{--ico:76px;margin:0 auto;background:color-mix(in srgb,var(--c) 18%,var(--field))}
.d-top h3{font:700 24px var(--font-d);letter-spacing:-.026em;margin:14px 0 2px}
.d-top .amt{font:700 clamp(36px,10.5vw,44px)/1.1 var(--font-n);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.d-top .amt small{font:500 17px var(--font-b);letter-spacing:-.01em;color:var(--muted)}
.kvs{margin-top:20px;background:var(--field);border-radius:20px;padding:0 16px}
.kv{display:flex;justify-content:space-between;gap:18px;padding:14px 0;font-size:16px}
.kv + .kv{border-top:1px solid var(--sep)}
.kv span:first-child{color:var(--muted);flex:0 1 auto}
.kv span:last-child{font-weight:500;text-align:right;flex:1 1 0;min-width:46%}

/* ============ MESSAGE ============ */
#toast{
  position:fixed;left:50%;
  bottom:calc(max(10px,calc(var(--sab) - 8px)) + 76px);
  transform:translate(-50%,16px);
  background:rgba(38,37,44,.94);color:#F5F3EE;
  padding:13px 18px;border-radius:22px;
  display:flex;gap:16px;align-items:center;
  max-width:calc(100% - 32px);width:max-content;
  font-weight:500;font-size:15px;line-height:1.35;
  opacity:0;pointer-events:none;z-index:130;
  box-shadow:0 14px 36px rgba(0,0,0,.32);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  backdrop-filter:blur(24px) saturate(180%);
  transition:opacity .22s,transform .3s cubic-bezier(.2,.8,.2,1);
}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#E6C27A;font:700 15px var(--font-b);cursor:pointer;padding:6px 0;margin:-6px 0;flex:none}

/* ============ ÉCRAN DE CODE (toujours sombre) ============ */
#lock{
  --k:clamp(58px,min(20vw,9.8vh),78px);
  position:fixed;inset:0;z-index:100;
  display:none;flex-direction:column;align-items:center;justify-content:center;
  padding:max(20px,var(--sat)) 24px max(20px,var(--sab));
  background:radial-gradient(90% 46% at 50% 0%,rgba(230,194,122,.2),transparent 70%),#0B0A0E;
  color:#fff;
  transition:opacity .35s,transform .45s;
}
#lock.on{display:flex}
#lock.leaving{opacity:0;transform:translateY(-32px);pointer-events:none}
.lock-in{width:100%;max-width:340px;display:flex;flex-direction:column;align-items:center}
.lock-logo{width:calc(var(--k) * .8);height:calc(var(--k) * .8)}
.lock-title{font:700 clamp(25px,7.6vw,30px)/1.1 var(--font-d);letter-spacing:-.028em;margin:calc(var(--k) * .26) 0 6px;text-align:center}
.lock-msg{
  min-height:42px;margin:0;
  color:rgba(245,243,238,.66);text-align:center;
  font-size:15px;font-weight:400;line-height:1.4;
}
.lock-msg.err{color:#FF9C9C;font-weight:600}
.dots{display:flex;gap:18px;margin:calc(var(--k) * .14) 0 calc(var(--k) * .42)}
.dots i{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(245,243,238,.6);transition:background .12s,border-color .12s,transform .12s}
.dots i.f{background:#E6C27A;border-color:#E6C27A;transform:scale(1.08)}
.dots.ok i{background:#FFF1CC;border-color:#FFF1CC}
.dots.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,var(--k));gap:calc(var(--k) * .2) calc(var(--k) * .34)}
.pad button{
  width:var(--k);height:var(--k);border-radius:50%;border:0;
  background:rgba(255,255,255,.11);color:#fff;
  font:400 calc(var(--k) * .43) var(--font-n);
  cursor:pointer;display:grid;place-items:center;
  transition:background .25s;
}
.pad button:active{background:rgba(255,255,255,.34);transition-duration:0s}
.pad button.none{background:none;pointer-events:none}
.pad button[data-k="del"]{background:none}
.pad button[data-k="del"]:active{opacity:.5}
.pad svg.i{width:calc(var(--k) * .4);height:calc(var(--k) * .4)}
.lock-links{margin-top:calc(var(--k) * .3);display:flex;gap:22px;min-height:44px}
.lock-links button{background:none;border:0;color:#E6C27A;font:500 16px var(--font-b);cursor:pointer;padding:10px 8px}
.lock-links button:active{opacity:.5}

/* ============ PASTILLE DE SYNCHRONISATION ============ */
.sdot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--faint);transition:background .3s}
.sdot[data-s="ok"]{background:var(--ok)}
.sdot[data-s="busy"]{background:var(--gold);animation:pulse 1s ease-in-out infinite}
.sdot[data-s="err"]{background:var(--danger)}
.sdot-in{position:static;flex:none}
@keyframes pulse{50%{opacity:.35}}

/* ============ ADAPTATIONS ============ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms !important;transition-duration:.01ms !important}
}

/* iPhone SE, mini : un peu plus compact */
@media (max-width:389px){
  :root{--gutter:16px;--ico:40px}
  .hero{padding:18px 16px 16px;border-radius:24px}
  .hero-stats div{padding:0 7px}
  .row{gap:12px;padding-left:14px;padding-right:14px;min-height:60px}
  .row + .row::before{left:calc(14px + var(--ico) + 12px)}
  .row-name,.row-amt,.neg{font-size:16px}
  .donut{width:104px;height:104px}
  .donut-wrap{gap:14px;padding:16px}
  .tabs,.fab{height:58px}
  .fab{width:58px}
  .tabs{border-radius:29px}
  .day b{width:34px;height:34px;font-size:16px}
}
@media (max-width:350px){
  .emojis{grid-template-columns:repeat(6,1fr)}
  .tab{font-size:9.5px;letter-spacing:-.02em}
  .dock{gap:8px}
  .legend{font-size:13px}
}
/* écrans courts */
@media (max-height:700px){
  .sec{margin-top:24px}
  .strip{height:50px;margin-top:28px}
  .field{margin-top:16px}
  .btn{min-height:50px}
}

/* iPhone en paysage */
@media (orientation:landscape) and (max-height:500px){
  .top{height:calc(var(--bar-top) + 48px);padding-bottom:4px}
  .top .ct{bottom:4px}
  main{padding-top:calc(var(--bar-top) + 48px);padding-bottom:calc(var(--sab) + 96px)}
  .lt{padding-bottom:12px}
  .lt p{display:none}
  .dock{left:50%;right:auto;transform:translateX(-50%);width:min(460px,calc(100% - 24px));bottom:max(8px,calc(var(--sab) - 8px))}
  .tabs,.fab{height:50px}
  .fab{width:50px}
  .tab{flex-direction:row;gap:7px;font-size:12px}
  .tab .pill svg.i{width:20px;height:20px}
  .sheet{max-width:560px;max-height:100%}
  #lock{--k:clamp(44px,13vh,58px)}
  .lock-msg{min-height:24px}
  #toast{bottom:calc(max(8px,calc(var(--sab) - 8px)) + 60px)}
}

/* iPad et grands écrans : colonne centrée */
@media (min-width:700px){
  :root{--gutter:28px}
  #shell{max-width:760px;border-left:1px solid var(--sep);border-right:1px solid var(--sep)}
  .dock{left:50%;right:auto;transform:translateX(-50%);width:480px}
  .sheet{max-width:620px;border-radius:28px;bottom:24px;padding-bottom:8px}
  .lt h1{font-size:38px}
}
@media (min-width:1000px){#shell{max-width:860px}}

<script>
(function(){var d=document.documentElement;
try{if(self!==top)d.classList.add('framed')}catch(e){d.classList.add('framed')}
/* hauteur réelle de l'écran */
function h(){d.style.setProperty('--app-h',window.innerHeight+'px')}
h();addEventListener('resize',h);addEventListener('orientationchange',function(){setTimeout(h,150)});
/* clavier iOS : les feuilles suivent la zone réellement visible */

function get(){try{var v=localStorage.getItem(K);return v==='light'||v==='dark'?v:'auto'}catch(e){return 'auto'}}
function apply(v){if(v==='light'||v==='dark')d.setAttribute('data-theme',v);else d.removeAttribute('data-theme')}
var cur=get();if(cur!=='auto')apply(cur);
window.coffreTheme={get:get,set:function(v){try{if(v==='auto')localStorage.removeItem(K);else localStorage.setItem(K,v)}catch(e){}apply(v)}};
})();

/* ============ utilitaires ============ */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ dates ============ */
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d, 12); };
const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate(), 12); };
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
function addMonthsClamped(base, months) {
  const first = new Date(base.getFullYear(), base.getMonth() + months, 1, 12);
  const dim = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return new Date(first.getFullYear(), first.getMonth(), Math.min(base.getDate(), dim), 12);
}
const dayDiff = (a, b) => Math.round((a - b) / 86400000);
const fShort = new Intl.DateTimeFormat('fr-FR', { day: 'numeric', month: 'short' });
const fLong = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const fMed = new Intl.DateTimeFormat('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
const fMonth = new Intl.DateTimeFormat('fr-FR', { month: 'long', year: 'numeric' });
const fMonthS = new Intl.DateTimeFormat('fr-FR', { month: 'short' });

function relDay(d) {
  const n = dayDiff(d, today());
  if (n === 0) return "Aujourd'hui";
  if (n === 1) return 'Demain';
  if (n === -1) return 'Hier';
  if (n > 1 && n < 8) return `Dans ${n} jours`;
  return fShort.format(d);
}

/* ============ calcul des prélèvements ============ */
function dateAt(sub, k) {
  const A = parse(sub.anchor), c = CYCLES[sub.cycle];
  return c.days ? addDays(A, k * c.days) : addMonthsClamped(A, k * c.months);
}
function occ(sub, from, to) {
  const A = parse(sub.anchor);
  let since = sub.since ? parse(sub.since) : A;
  if (since > A) since = A;
  const lo = from < since ? since : from;
  let hi = to;
  if (sub.paused && sub.pausedAt) { const cut = parse(sub.pausedAt); if (cut < hi) hi = cut; }
  const out = [];
  if (lo > hi) return out;
  let k = 0, g = 0;
  while (g++ < 4000) { const d = dateAt(sub, k); if (d > hi) break; if (d >= lo) out.push(d); k++; }
  k = -1; g = 0;
  while (g++ < 4000) { const d = dateAt(sub, k); if (d < lo) break; if (d <= hi) out.push(d); k--; }
  const gaps = (sub.gaps || []).map(x => [parse(x[0]), parse(x[1])]);
  return out.filter(d => !gaps.some(x => d > x[0] && d < x[1])).sort((a, b) => a - b);
}
function nextDate(sub) {
  if (sub.paused) return null;
  const t = today();
  return occ(sub, t, addDays(t, 400))[0] || null;
}
function monthlyEq(s) {
  switch (s.cycle) {
    case 'weekly': return s.amount * 52 / 12;
    case 'quarterly': return s.amount / 3;
    case 'yearly': return s.amount / 12;
    default: return s.amount;
  }
}
const activeSubs = () => state.subs.filter(s => !s.paused);
function monthOcc(y, m) {
  const from = new Date(y, m, 1, 12), to = new Date(y, m + 1, 0, 12), out = [];
  state.subs.forEach(s => occ(s, from, to).forEach(d => out.push({ sub: s, date: d })));
  return out.sort((a, b) => a.date - b.date);
}
const sum = arr => arr.reduce((a, o) => a + o.sub.amount, 0);

const nf = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR' });
const nf0 = new Intl.NumberFormat('fr-FR', { style: 'currency', currency: 'EUR', maximumFractionDigits: 0 });
const nInt = new Intl.NumberFormat('fr-FR');
const money = n => nf.format(n);
const moneyFlex = n => Math.abs(n) >= 100 ? nf0.format(n) : nf.format(n);
function bigMoney(n) {
  const cents = Math.round(Math.abs(n) * 100), i = Math.floor(cents / 100), c = cents % 100;
  return `<span>${nInt.format(i)}</span><span class="dec">,${pad(c)} €</span>`;
}

function closeSheet(immediate) {
  const root = $('#sheetRoot');
  if (!root.classList.contains('open')) return;
  root.classList.remove('show');
  const done = () => { root.classList.remove('open'); root.innerHTML = ''; if (lastFocus && lastFocus.focus && unlocked) { try { lastFocus.focus({ preventScroll: true }); } catch (e) {} } };
  if (immediate) { root.classList.remove('open'); root.innerHTML = ''; } else setTimeout(done, 280);
}
const sheetOpen = () => $('#sheetRoot').classList.contains('open');
(function () {
  const root = $('#sheetRoot'); let g = null;
  root.addEventListener('touchstart', e => {
    g = null;
    const sheet = root.querySelector('.sheet'); if (!sheet || e.touches.length !== 1) return;
    const t = e.target;
    if (t.closest('input,select,textarea')) return;
    const body = t.closest('.sheet-body');
    const onHandle = t.closest('.grab,.sheet-head');
    const fixedBody = body && body.scrollHeight <= body.clientHeight + 1;
    if (!onHandle && !fixedBody) return;
    g = { y: e.touches[0].clientY, t0: Date.now(), sheet, dy: 0, on: false };
  }, { passive: true });
  root.addEventListener('touchmove', e => {
    if (!g) return;
    const dy = e.touches[0].clientY - g.y;
    if (!g.on) {
      if (dy < 8) return;
      g.on = true; g.sheet.style.transition = 'none';
    }
    g.dy = Math.max(0, dy);
    g.sheet.style.transform = `translate(-50%,${g.dy}px)`;
    if (e.cancelable) e.preventDefault();
  }, { passive: false });
  const end = () => {
    if (!g) return; const s = g; g = null; if (!s.on) return;
    s.sheet.style.transition = '';
    const speed = s.dy / Math.max(1, Date.now() - s.t0);
    if (s.dy > 110 || (s.dy > 30 && speed > .55)) { s.sheet.style.transform = 'translate(-50%,100%)'; closeSheet(); }
    else s.sheet.style.transform = '';
  };
  root.addEventListener('touchend', end); root.addEventListener('touchcancel', end);
})();

  const t0 = performance.now(), dur = 800;

/* ---- Accueil ---- */
function renderHome() {
  const t = today(), y = t.getFullYear(), m = t.getMonth();
  const mo = monthOcc(y, m); homeMo = mo;
  const paid = sum(mo.filter(o => o.date <= t));
  const nextAmt = sum(mo.filter(o => o.date > t));
  const total = paid + nextAmt;
  const yearly = activeSubs().reduce((a, s) => a + monthlyEq(s) * 12, 0);
  const dim = new Date(y, m + 1, 0).getDate();
  const perDay = Array(dim + 1).fill(0);
  mo.forEach(o => perDay[o.date.getDate()] += o.sub.amount);
  const maxDay = Math.max(...perDay, 1);
  let strip = '';
  for (let d = 1; d <= dim; d++) {
    const has = perDay[d] > 0, isT = d === t.getDate();
    const cls = `col${has ? ' has' : ''}${d > t.getDate() ? ' fut' : ''}${isT ? ' today' : ''}`;
    const h = has ? `style="height:${Math.max(22, perDay[d] / maxDay * 100)}%"` : '';
    const inner = `${isT ? '<b>Auj.</b>' : ''}<i ${h}></i>`;
    const dstr = iso(new Date(y, m, d, 12));
    strip += has ? `<button type="button" class="${cls}" data-act="stripDay" data-day="${dstr}" aria-label="${d} ${fMonthS.format(t)} : ${money(perDay[d])}">${inner}</button>` : `<div class="${cls}">${inner}</div>`;
  }
  const hero = `<section class="hero" aria-label="Résumé du mois">
    <div class="hero-label">Abonnements en ${esc(fMonth.format(t))}</div>
    <div class="hero-amount" id="heroAmount" data-v="${total}">${bigMoney(total)}</div>
    <div class="strip" role="group" aria-label="Jours de prélèvement du mois">${strip}</div>
    <div class="axis"><span>1 ${esc(fMonthS.format(t))}</span><span>${dim} ${esc(fMonthS.format(t))}</span></div>
    <div class="hero-stats">
      <div><small>Déjà prélevé</small><b>${moneyFlex(paid)}</b></div>
      <div><small>Encore à venir</small><b>${moneyFlex(nextAmt)}</b></div>
      <div><small>Sur 12 mois</small><b>${moneyFlex(yearly)}</b></div>
    </div></section>`;
  if (!state.subs.length) return hero + emptyState();

  const ups = [];
  const horizon = addDays(t, 30);
  activeSubs().forEach(s => occ(s, t, horizon).forEach(d => ups.push({ s, d })));
  ups.sort((a, b) => a.d - b.d);
  const soon = ups.filter(u => u.d > t && u.d <= addDays(t, 3));
  const soonHTML = soon.length ? `<div class="soon" role="status">${ic('bell')}<span>${soon.slice(0, 2).map(u => `${esc(relDay(u.d))} : <b>${esc(u.s.name)}</b> (${money(u.s.amount)})`).join('<br>')}${soon.length > 2 ? `<br>et ${soon.length - 2} autre${soon.length > 3 ? 's' : ''}` : ''}</span></div>` : '';

  let budgetHTML;
  if (state.budget > 0) {
    const pPaid = Math.min(100, paid / state.budget * 100);
    const pNext = Math.min(100 - pPaid, nextAmt / state.budget * 100);
    const over = total > state.budget;
    const left = state.budget - total;
    budgetHTML = `<div class="budget"><div class="budget-big">${over ? `Dépassé de ${money(-left)}` : `Il te reste ${money(left)}`}</div>
      <div class="bar ${over ? 'over' : ''}" role="img" aria-label="${money(total)} sur un budget de ${money(state.budget)}"><div class="p" style="width:${over ? 100 : pPaid}%"></div>${over ? '' : `<div class="f" style="width:${pNext}%"></div>`}</div>
      <div class="budget-line"><span>${money(total)} prévus</span><span>sur <b>${money(state.budget)}</b></span></div></div>`;
  } else {
    budgetHTML = `<div class="budget"><div class="budget-big">Pas de budget fixé</div><p>Fixe un plafond mensuel pour savoir s’il te reste de la marge.</p><button class="btn ghost sm" data-act="budget">Définir un budget</button></div>`;
  }

  const upsHTML = ups.length ? ups.slice(0, 5).map(u => `<button class="row" data-act="open" data-id="${u.s.id}"><span class="ico" style="--c:${esc(u.s.color)}">${esc(u.s.emoji)}</span><span class="row-main"><span class="row-name">${esc(u.s.name)}</span><span class="row-sub">${esc(relDay(u.d))}</span></span><span class="row-amt">${money(u.s.amount)}</span></button>`).join('') : `<div class="empty-sm">Aucun prélèvement dans les 30 prochains jours.</div>`;

  const byCat = {};
  activeSubs().forEach(s => byCat[s.cat] = (byCat[s.cat] || 0) + monthlyEq(s));
  const entries = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  const totM = entries.reduce((a, e) => a + e[1], 0);
  let donut = '', legend = '', acc = 0;
  entries.forEach(([k, v]) => {
    const pct = v / totM * 100, c = (CATS[k] || CATS.autre).c;
    donut += `<circle cx="21" cy="21" r="15.9155" fill="none" stroke="${c}" stroke-width="6" stroke-dasharray="${Math.max(pct - .6, .1)} ${100 - Math.max(pct - .6, .1)}" stroke-dashoffset="${-acc}"/>`;
    acc += pct;
    legend += `<div style="--c:${c}"><i></i><span>${esc((CATS[k] || CATS.autre).l)}</span><em>${Math.round(pct)} %</em></div>`;
  });
  const catHTML = entries.length ? `<div class="donut-wrap"><div class="donut"><svg viewBox="0 0 42 42" role="img" aria-label="Répartition par catégorie"><circle cx="21" cy="21" r="15.9155" fill="none" stroke-width="6"/>${donut}</svg><div class="mid"><b>${moneyFlex(totM)}</b><small>par mois, lissé</small></div></div><div class="legend">${legend}</div></div>` : '';

  const priciest = activeSubs().slice().sort((a, b) => monthlyEq(b) - monthlyEq(a))[0];
  const tip = priciest ? `<div class="group gap"><div class="row static"><span class="ico" style="--c:${esc(priciest.color)}">${esc(priciest.emoji)}</span><span class="row-main"><span class="row-name">${esc(priciest.name)} pèse le plus</span><span class="row-sub">${money(monthlyEq(priciest) * 12)} par an. Le mettre en pause te ferait économiser ${money(monthlyEq(priciest))} par mois.</span></span></div></div>` : '';

  return hero + soonHTML +
    `<section class="sec"><div class="sec-h"><h2>Budget du mois</h2>${state.budget > 0 ? '<button class="link" data-act="budget">Modifier</button>' : ''}</div>${budgetHTML}</section>
     <section class="sec"><div class="sec-h"><h2>Prochains prélèvements</h2><button class="link" data-tab="subs">Tout voir</button></div><div class="group">${upsHTML}</div></section>
     <section class="sec"><div class="sec-h"><h2>Où part l’argent</h2></div>${catHTML}${tip}</section>`;
}

function renderSubs() {

  return `<div class="summary"><div><small>Par mois, lissé</small><b>${moneyFlex(monthly)}</b></div><div><small>Par an</small><b>${moneyFlex(monthly * 12)}</b></div></div>

    <div class="filters">${f('all', `Tous (${state.subs.length})`)}${f('active', `Actifs (${act.length})`)}${pausedN ? f('paused', `En pause (${pausedN})`) : ''}</div>
    <div class="sortline"><span>Trier par</span><select id="sort" aria-label="Trier par"><option value="next" ${ui.sort === 'next' ? 'selected' : ''}>Prochain prélèvement</option><option value="price" ${ui.sort === 'price' ? 'selected' : ''}>Prix décroissant</option><option value="name" ${ui.sort === 'name' ? 'selected' : ''}>Nom</option></select></div>
    <div class="group" id="subsList">${subsListHTML()}</div>`;
}

/* ---- Calendrier ---- */
function renderCal() {
  const t = today();
  if (!ui.cal) ui.cal = { y: t.getFullYear(), m: t.getMonth() };
  const { y, m } = ui.cal;
  const mo = monthOcc(y, m);
  const byDay = {};
  mo.forEach(o => (byDay[o.date.getDate()] = byDay[o.date.getDate()] || []).push(o));
  const dim = new Date(y, m + 1, 0).getDate();
  const lead = (new Date(y, m, 1, 12).getDay() + 6) % 7;
  if (!ui.calSel || ui.calSel.slice(0, 7) !== `${y}-${pad(m + 1)}`) {
    const isCur = t.getFullYear() === y && t.getMonth() === m;
    ui.calSel = iso(new Date(y, m, isCur ? t.getDate() : 1, 12));
  }
  const selD = parseInt(ui.calSel.slice(8), 10);
  let cells = '';
  for (let i = 0; i < lead; i++) cells += '<div class="day blank"></div>';
  for (let d = 1; d <= dim; d++) {
    const list = byDay[d] || [];
    const isT = t.getFullYear() === y && t.getMonth() === m && t.getDate() === d;
    const dots = list.slice(0, 3).map(o => `<i style="--c:${esc(o.sub.color)}"></i>`).join('');
    cells += `<button type="button" class="day${isT ? ' today' : ''}${d === selD ? ' sel' : ''}" data-act="calDay" data-day="${iso(new Date(y, m, d, 12))}" aria-label="${d} ${esc(fMonth.format(new Date(y, m, 1)))}, ${list.length} prélèvement${list.length > 1 ? 's' : ''}"><b>${d}</b><span class="dts">${dots}</span></button>`;
  }
  const selList = byDay[selD] || [];
  const selDate = new Date(y, m, selD, 12);
  const dayRows = selList.length ? selList.map(o => `<button class="row" data-act="open" data-id="${o.sub.id}"><span class="ico" style="--c:${esc(o.sub.color)}">${esc(o.sub.emoji)}</span><span class="row-main"><span class="row-name">${esc(o.sub.name)}</span><span class="row-sub">${o.date <= t ? 'Prélevé' : 'À venir'}${o.sub.paused ? ', abonnement en pause' : ''}</span></span><span class="row-amt">${money(o.sub.amount)}</span></button>`).join('') : `<div class="empty-sm">Aucun prélèvement ce jour-là.</div>`;
  return `<div class="cal-head"><button class="icon-btn" data-act="calPrev" aria-label="Mois précédent">${ic('left')}</button>
      <div><h2>${esc(cap(fMonth.format(new Date(y, m, 1))))}</h2><small>${money(sum(mo))} sur le mois</small></div>
      <button class="icon-btn" data-act="calNext" aria-label="Mois suivant">${ic('right')}</button></div>
    <div class="calbox"><div class="dow" aria-hidden="true"><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
    <div class="grid7">${cells}</div></div>
    <div class="day-total"><h3>${esc(cap(fLong.format(selDate)))}</h3>${selList.length ? `<b>${money(sum(selList))}</b>` : ''}</div>
    <div class="group">${dayRows}</div>`;
}

/* ---- Historique ---- */
function allPast() {
  const t = today(), out = [];
  state.subs.forEach(s => {
    const A = parse(s.anchor), since = s.since ? parse(s.since) : A;
    occ(s, since < A ? since : A, t).forEach(d => out.push({ sub: s, date: d }));
  });
  return out.sort((a, b) => b.date - a.date);
}
function renderHist() {
  if (!state.subs.length) return emptyState();
  const t = today();
  const past = allPast();
  const totalAll = sum(past);
  const totalYear = sum(past.filter(o => o.date.getFullYear() === t.getFullYear()));
  const bars = [];
  for (let i = 5; i >= 0; i--) {
    const d = new Date(t.getFullYear(), t.getMonth() - i, 1, 12);
    const mo = monthOcc(d.getFullYear(), d.getMonth());
    bars.push({ d, pd: sum(mo.filter(o => o.date <= t)), fu: sum(mo.filter(o => o.date > t)), now: i === 0 });
  }
  const maxB = Math.max(...bars.map(b => b.pd + b.fu), 1);
  const chart = bars.map(b => `<div class="bcol${b.now ? ' now' : ''}"><b>${b.pd + b.fu ? nf0.format(b.pd + b.fu) : '–'}</b><div class="stack" role="img" aria-label="${esc(cap(fMonth.format(b.d)))} : ${money(b.pd + b.fu)}">${b.fu ? `<i class="fu" style="height:${b.fu / maxB * 100}%"></i>` : ''}${b.pd ? `<i class="pd" style="height:${b.pd / maxB * 100}%"></i>` : ''}</div><span>${esc(fMonthS.format(b.d).replace('.', ''))}</span></div>`).join('');
  const groups = [];
  past.forEach(o => {
    const k = `${o.date.getFullYear()}-${pad(o.date.getMonth() + 1)}`;
    let g = groups[groups.length - 1];
    if (!g || g.k !== k) { g = { k, d: o.date, list: [] }; groups.push(g); }
    g.list.push(o);
  });
  const shown = groups.slice(0, ui.hist);
  const listHTML = shown.length ? shown.map(g => `<div class="month-h"><h3>${esc(cap(fMonth.format(g.d)))}</h3><span>−${money(sum(g.list))}</span></div>
    <div class="group">${g.list.map(o => `<button class="row" data-act="open" data-id="${o.sub.id}"><span class="ico" style="--c:${esc(o.sub.color)}">${esc(o.sub.emoji)}</span><span class="row-main"><span class="row-name">${esc(o.sub.name)}</span><span class="row-sub">${esc(cap(fMed.format(o.date)))}</span></span><span class="neg">−${money(o.sub.amount)}</span></button>`).join('')}</div>`).join('') : `<div class="empty-sm">Aucun prélèvement passé. Renseigne « Abonné depuis » sur un abonnement pour reconstituer son historique.</div>`;
  return `<div class="summary"><div><small>Depuis le début</small><b>${moneyFlex(totalAll)}</b></div><div><small>En ${t.getFullYear()}</small><b>${moneyFlex(totalYear)}</b></div></div>
    <section class="sec"><div class="sec-h"><h2>6 derniers mois</h2></div><div class="chart" aria-label="Dépenses mensuelles">${chart}</div></section>
    ${listHTML}
    ${groups.length > ui.hist ? `<button class="btn ghost more" data-act="moreHist">Afficher les mois précédents</button>` : ''}`;
}

function confirmSheet(title, text, label, fn) {

/* ============ actions ============ */
function parseMoney(v) { return parseFloat(String(v).replace(/\s/g, '').replace(',', '.')); }

const handlers = {
  add: () => openForm(),
  lock: () => lockNow(),
  settings: () => openSettings(),
  budget: () => openSettings(true),
  open: el => openDetail(el.dataset.id),
  edit: el => { const id = el.dataset.id; closeSheet(true); openForm(id); },
  togglePause: el => {
    const s = state.subs.find(x => x.id === el.dataset.id); if (!s) return;
    const t = iso(today());
    if (s.paused) { s.gaps = (s.gaps || []).concat([[s.pausedAt || t, t]]); s.paused = false; s.pausedAt = null; toast(`${s.name} réactivé`); }
    else { s.paused = true; s.pausedAt = t; toast(`${s.name} en pause : plus aucun prélèvement prévu`); }
    save(); closeSheet(); render();
  },
  del: el => {
    const i = state.subs.findIndex(x => x.id === el.dataset.id); if (i < 0) return;
    const [s] = state.subs.splice(i, 1);
    save(); closeSheet(); render();
    toast(`${s.name} supprimé`, { label: 'Annuler', fn: () => { state.subs.splice(Math.min(i, state.subs.length), 0, s); save(); render(); } });
  },
  filter: el => { ui.filter = el.dataset.f; render(); },
  calPrev: () => { const c = ui.cal; ui.cal = c.m === 0 ? { y: c.y - 1, m: 11 } : { y: c.y, m: c.m - 1 }; render(); },
  calNext: () => { const c = ui.cal; ui.cal = c.m === 11 ? { y: c.y + 1, m: 0 } : { y: c.y, m: c.m + 1 }; render(); },
  calDay: el => { ui.calSel = el.dataset.day; render(); },
  moreHist: () => { ui.hist += 3; render(); },
  stripDay: el => {
    const items = homeMo.filter(o => iso(o.date) === el.dataset.day);
    toast(`${fShort.format(parse(el.dataset.day))} : ${items.map(o => `${o.sub.name} ${money(o.sub.amount)}`).join(', ')}`);
  },
  saveBudget: () => {
    const raw = $('#s-budget').value.trim();
    const v = raw ? parseMoney(raw) : 0;
    if (raw && !(v > 0)) return toast('Saisis un montant valide.');
    state.budget = v || 0; save(); closeSheet(); render();
    toast(state.budget ? `Budget fixé à ${money(state.budget)} par mois` : 'Budget désactivé');
  },
  syncNow: async () => {
    if (!sync.ref) return;
    setSyncStatus('busy');
    try { onRemote(await sync.ref.get()); toast('Synchronisation à jour'); } catch (e) { setSyncStatus('err'); toast('Synchronisation impossible pour le moment.'); }
  },
  changePin: () => { closeSheet(true); showLock('change'); },
  theme: el => {
    if (window.coffreTheme) window.coffreTheme.set(el.dataset.v);
    el.parentNode.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b === el ? 'true' : 'false'));
  },
  resetAll: () => confirmSheet('Tout effacer ?', (sync.ref ? 'Tes abonnements, ton budget et ton code seront supprimés sur tous tes appareils synchronisés. Cette action est définitive.' : 'Tes abonnements, ton budget et ton code seront supprimés de cet appareil. Cette action est définitive.'), 'Tout effacer', wipe)
};
function wipe() {
  state = defaults();
  state.updatedAt = Date.now();
  localWrite(); schedulePush();
  unlocked = false; ui.tab = 'home'; ui.q = ''; ui.filter = 'all';
  showLock('setup');
}

  if (b.dataset.l === 'cancel') { lockEl.classList.remove('on'); }
});

async function hashPin(pin, salt) {
  try {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin));
    return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 5381; const s = salt + ':' + pin;
    for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) | 0;
    return 'x' + h;
  }
}
async function setPin(pin) {
  const salt = uid() + uid();
  state.pin = { salt, hash: await hashPin(pin, salt) };
  state.lock = { fails: 0, level: 0, until: 0 };
  save();
}
function lockText() {
  if (L.mode === 'setup') return L.step === 'new' ? ['Crée ton code', 'Choisis 4 chiffres pour protéger tes abonnements.'] : ['Confirme ton code', 'Saisis le même code une seconde fois.'];
  if (L.mode === 'change') return L.step === 'verify' ? ['Code actuel', 'Saisis ton code actuel pour continuer.'] : L.step === 'new' ? ['Nouveau code', 'Choisis 4 nouveaux chiffres.'] : ['Confirme le nouveau code', 'Saisis-le une seconde fois.'];
  return ['Bon retour', 'Saisis ton code à 4 chiffres.'];
}
function drawLock(msg, isErr) {
  const [t, m] = lockText();
  $('#lockTitle').textContent = t;
  const me = $('#lockMsg'); me.textContent = msg || m; me.classList.toggle('err', !!isErr);
  const dots = $('#dots'); dots.className = 'dots';
  dots.querySelectorAll('i').forEach((d, i) => d.classList.toggle('f', i < L.buf.length));
  let links = '';
  if (L.mode === 'unlock') links = '<button type="button" data-l="forgot">Code oublié ?</button>';
  if (L.mode === 'change') links = '<button type="button" data-l="cancel">Annuler</button>';
  $('#lockLinks').innerHTML = links;
}
function showLock(mode) {
  L.mode = mode; L.step = mode === 'setup' ? 'new' : mode === 'change' ? 'verify' : 'enter';
  L.buf = ''; L.first = null; L.busy = false;
  closeSheet(true);
  if (mode !== 'change') { $('#main').innerHTML = ''; $('#top').innerHTML = ''; $('#fab').hidden = true; }
  lockEl.classList.remove('leaving'); lockEl.classList.add('on');
  drawLock(); lockoutTick();
}
function lockNow() { if (!state.pin) return; unlocked = false; showLock('unlock'); }
function remaining() { return Math.max(0, Math.ceil(((state.lock && state.lock.until) - Date.now()) / 1000)); }
function lockoutTick() {
  clearInterval(lockTimer);
  if (!remaining()) return;
  const tick = () => {
    const r = remaining();
    if (!r) { clearInterval(lockTimer); drawLock(); return; }
    $('#lockMsg').textContent = `Trop d’essais. Réessaie dans ${r} s.`; $('#lockMsg').classList.add('err');
  };
  tick(); lockTimer = setInterval(tick, 500);
}
function press(k) {
  if (L.busy || L.wait || remaining()) return;
  if (k === 'del') L.buf = L.buf.slice(0, -1);
  else if (L.buf.length < 4) L.buf += k;
  $('#dots').querySelectorAll('i').forEach((d, i) => d.classList.toggle('f', i < L.buf.length));
  if (L.buf.length === 4) { L.busy = true; setTimeout(processPin, 160); }
}
function shake(msg) {
  const d = $('#dots'); d.classList.remove('shake'); void d.offsetWidth; d.classList.add('shake');
  L.buf = ''; L.busy = false;
  setTimeout(() => { $('#dots').querySelectorAll('i').forEach(i => i.classList.remove('f')); }, 120);
  const me = $('#lockMsg'); me.textContent = msg; me.classList.add('err');
}
function succeed(cb) {
  $('#dots').classList.add('ok');
  setTimeout(() => {
    cb();
    lockEl.classList.add('leaving');
    setTimeout(() => { lockEl.classList.remove('on', 'leaving'); }, 380);
  }, 300);
}
function wrong() {
  const lk = state.lock = state.lock || { fails: 0, level: 0, until: 0 };
  lk.fails++;
  if (lk.fails >= 5) {
    lk.level++; lk.fails = 0;
    lk.until = Date.now() + Math.min(600, 30 * Math.pow(2, lk.level - 1)) * 1000;
    save(true); shake('Code incorrect.'); lockoutTick();
  } else {
    save(true); const r = 5 - lk.fails;
    shake(`Code incorrect. ${r} essai${r > 1 ? 's' : ''} restant${r > 1 ? 's' : ''}.`);
  }
}
function enterApp() {
  unlocked = true; ui.animate = true; resetIdle(); render();
}
async function processPin() {
  const pin = L.buf;
  if (L.mode === 'unlock' || (L.mode === 'change' && L.step === 'verify')) {
    const ok = (await hashPin(pin, state.pin.salt)) === state.pin.hash;
    if (!ok) return wrong();
    state.lock = { fails: 0, level: 0, until: 0 }; save(true);
    if (L.mode === 'unlock') return succeed(enterApp);
    L.step = 'new'; L.buf = ''; L.busy = false; return drawLock();
  }
  if (L.step === 'new') { L.first = pin; L.step = 'confirm'; L.buf = ''; L.busy = false; return drawLock(); }
  if (pin !== L.first) {
    L.step = 'new'; L.first = null;
    shake('Les deux codes sont différents. Choisis-en un nouveau.');
    setTimeout(() => { $('#lockTitle').textContent = lockText()[0]; }, 0);
    return;
  }
  await setPin(pin);
  if (L.mode === 'setup') succeed(enterApp);
  else succeed(() => toast('Code modifié'));
}
document.addEventListener('keydown', e => {
  if (lockEl.classList.contains('on') && !sheetOpen()) {
    if (/^\d$/.test(e.key)) { press(e.key); e.preventDefault(); }
    else if (e.key === 'Backspace') { press('del'); e.preventDefault(); }
    else if (e.key === 'Escape' && L.mode === 'change') lockEl.classList.remove('on');
    return;
  }
  if (e.key === 'Escape' && sheetOpen()) closeSheet();
});

/* verrouillage automatique */
let idleTimer, hiddenAt = 0;
function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => { if (unlocked && state.pin) lockNow(); }, 120000); }
['pointerdown', 'keydown', 'touchstart'].forEach(ev => document.addEventListener(ev, () => { if (unlocked) resetIdle(); }, { passive: true }));
document.addEventListener('scroll', () => { if (unlocked) resetIdle(); }, { passive: true, capture: true });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (unlocked && state.pin && hiddenAt && Date.now() - hiddenAt > 30000) lockNow();
});

/* ============ synchronisation ============ */
const sync = { ref: null, status: 'local', timer: null, pushing: false, dirty: false, seen: false };
let booted = false;
function syncLabel() {
  return ({ ok: 'Synchronisé avec tes autres appareils.', busy: 'Synchronisation en cours…', err: 'Synchronisation interrompue. Elle reprendra au prochain changement.', local: 'Synchronisation indisponible : les données restent sur cet appareil.' })[sync.status];
}
function setSyncStatus(st) {
  sync.status = st;
  document.querySelectorAll('.sdot').forEach(e => { e.dataset.s = st; });
  const l = $('#syncLabel'); if (l) l.textContent = syncLabel();
}
function payload() {
  return JSON.parse(JSON.stringify({ subs: state.subs, budget: state.budget, pin: state.pin, updatedAt: state.updatedAt, v: 1 }));
}
function schedulePush() {
  if (!sync.ref) return;
  setSyncStatus('busy');
  clearTimeout(sync.timer);
  sync.timer = setTimeout(pushNow, 500);
}
async function pushNow() {
  if (!sync.ref) return;
  if (sync.pushing) { sync.dirty = true; return; }
  sync.pushing = true;
  try {
    do {
      sync.dirty = false;
      try { await sync.ref.set(payload()); }
      catch (e) {
        if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 700 + Math.random() * 900)); await sync.ref.set(payload()); }
        else throw e;
      }
    } while (sync.dirty);
    setSyncStatus('ok');
  } catch (e) { setSyncStatus('err'); }
  sync.pushing = false;
}
function adopt(r) {
  const lock = state.lock;
  const hadPin = !!state.pin;
  state = Object.assign(defaults(), JSON.parse(JSON.stringify(r)), { lock });
  state.updatedAt = +r.updatedAt || 0;
  localWrite();
  setSyncStatus('ok');
  if (!booted) return;
  if (unlocked) {
    if (!state.pin) { unlocked = false; showLock('setup'); toast('Le coffre a été réinitialisé depuis un autre appareil.'); }
    else { render(); toast('Mis à jour depuis un autre appareil'); }
  } else if (lockEl.classList.contains('on')) {
    if (L.mode === 'unlock' && !state.pin) showLock('setup');
    else if (L.mode === 'setup' && state.pin) showLock('unlock');
  }
}
function onRemote(snap) {
  const fromCache = snap.metadata && snap.metadata.fromCache;
  if (!snap.exists) {
    if (fromCache || sync.seen) return;
    sync.seen = true;
    if (state.pin || state.subs.length) { if (!state.updatedAt) { state.updatedAt = Date.now(); localWrite(); } schedulePush(); }
    else setSyncStatus('ok');
    return;
  }
  const r = snap.data() || {};
  const ru = +r.updatedAt || 0, lu = state.updatedAt || 0;
  const virgin = !state.pin && !state.subs.length && (r.pin || (r.subs && r.subs.length));
  if (ru > lu || virgin) { sync.seen = true; adopt(r); return; }
  if (fromCache) return;
  sync.seen = true;
  if (ru < lu && !sync.pushing) schedulePush(); else setSyncStatus('ok');
}
async function initSync() {
  try {
    if (!window.claude || !window.claude.use) return false;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return false;
    const id = await user.id();
    if (!id) return false;
    sync.ref = db.doc('data/users/' + id + '/coffre');
    setSyncStatus('busy');
    return await new Promise(res => {
      let first = true;
      sync.ref.onSnapshot(snap => {
        try { onRemote(snap); } catch (e) {}
        if (first) { first = false; res(true); }
      }, err => {
        setSyncStatus(err && err.code === 'revoked' ? 'local' : 'err');
        if (err && err.code === 'revoked') sync.ref = null;
        if (first) { first = false; res(false); }
      });
    });
  } catch (e) { return false; }
}

/* ============ démarrage ============ */
async function boot() {
  showLock(state.pin ? 'unlock' : 'setup');
  L.wait = true; $('#lockMsg').textContent = 'Synchronisation…';
  await Promise.race([initSync(), new Promise(r => setTimeout(r, 12000))]);
  booted = true; L.wait = false;
  if (lockEl.classList.contains('on') && !unlocked) showLock(state.pin ? 'unlock' : 'setup');
}
boot();
</script>
